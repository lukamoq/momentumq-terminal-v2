<!DOCTYPE html>
<html lang="en" data-theme="obsidian" data-density="comfortable" data-rail="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MomentumQ Terminal</title>
<meta name="description" content="Institutional quantitative research terminal — sell-side forecast audit, Mag 7 breakdown, cross-asset seasonality, BSM options Greeks and dealer GEX, macro regime, AI desk and crypto cycles.">
<link rel="icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/panel.css">
<link rel="stylesheet" href="styles/table.css">
<link rel="stylesheet" href="styles/chart.css">
<link rel="stylesheet" href="styles/overlay.css">
<link rel="stylesheet" href="styles/module.css">

<!-- The first three endpoints of the default module, warmed before the shell
     script has even parsed. Saves a full round trip on cold load. -->
<link rel="preload" as="fetch" href="/api/stats" crossorigin>
<link rel="preload" as="fetch" href="/api/scorecard" crossorigin>
<link rel="modulepreload" href="app/main.js">

<script>
  // Paint the saved theme and density before first paint, so a reload never
  // flashes the default palette at someone running the amber CRT.
  try {
    var p = JSON.parse(localStorage.getItem('mq.terminal.v3') || '{}');
    var r = document.documentElement;
    if (p.theme) r.dataset.theme = p.theme;
    if (p.density) r.dataset.density = p.density;
    if (p.rail) r.dataset.rail = p.rail;
  } catch (e) {}
</script>
</head>
<body>
<noscript>
  <div style="padding:40px;font-family:system-ui;color:#c8d0e2;background:#0b0e17;height:100vh">
    <h1 style="font-size:20px;margin-bottom:12px">MomentumQ Terminal</h1>
    <p>This terminal renders live analytics in the browser and needs JavaScript enabled.
       The underlying data is available directly from the JSON API at <code>/api/…</code>.</p>
  </div>
</noscript>
<script type="module" src="app/main.js"></script>
</body>
</html>
